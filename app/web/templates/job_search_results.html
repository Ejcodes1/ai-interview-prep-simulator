{% extends "base.html" %}
{% block title %}Job Search Results{% endblock %}
{% block content %}
  <section class="card">
    <h2>Results for "{{ keyword }}"</h2>

    {% if warning %}
      <p class="warning" role="status">{{ warning }}</p>
    {% endif %}

    {% for job in results %}
      <div class="job-result">
        <h3>{{ job.title }}</h3>
        <p class="company">{{ job.company }}</p>
        <p class="summary">{{ job.summary }}</p>
        <form action="{{ url_for('web.job_select_view') }}" method="post">
          <input type="hidden" name="title" value="{{ job.title }}">
          <input type="hidden" name="company" value="{{ job.company }}">
          <input type="hidden" name="description" value="{{ job.description }}">
          <button type="submit">Use this posting</button>
        </form>
      </div>
    {% endfor %}
  </section>

  <a class="back-link" href="{{ url_for('web.job_search_form') }}">&larr; Search again</a>
{% endblock %}
